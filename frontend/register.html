<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Register - Game Zone</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background-animation"></div>

<div class="login-container">

<div class="logo">
GAME ZONE
</div>

<h2>Create Account</h2>

<input type="text" id="reg-username" placeholder="Username">
<input type="email" id="reg-email" placeholder="Email">
<input type="password" id="reg-password" placeholder="Password">
<input type="password" id="reg-confirm" placeholder="Confirm Password">
<input type="tel" id="reg-phone" placeholder="Phone Number">
<input type="text" placeholder="Referral Code (Optional)">
<input type="text" placeholder="Wallet ID">

<button class="login-btn" id="register-btn">Register</button>

<a href="index.html" class="forgot-link">
Already have account? Login
</a>

</div>

<script src="js/register.js"></script>
</body>

</html>
