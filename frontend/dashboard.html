<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stake Clone Dashboard</title>
  <style>
    /* --- 1. CORE THEME VARIABLES & FIRE ANIMATION VALUES --- */
    :root {
      /* DARK MODE DEFAULT (Red Theme) */
      --bg-main: #0a0a0a;
      /* Dark background from image */
      --rock-border: #1a1a1a;
      /* Dark rock-like structure border */
      --text-primary: #f1f1f1;
      --logo-gold: #facc15;

      /* --- THE RED FIRE EFFECT --- */
      /* Comment: These are the colors used for the moving flame.
       Adjust these to change the 'intensity' of the red flame. */
      --flame-color-1: rgba(185, 28, 28, 0.7);
      /* Deep Dark Red */
      --flame-color-2: rgba(239, 68, 68, 0.9);
      /* Mid Red */
      --flame-color-3: rgba(254, 240, 138, 0.5);
      /* Yellow/Orange (Core) */

      /* The image for the monster in Dark mode */
      --monster-image: url('images/reaper-red.png');
    }

    /* LIGHT MODE (Blue Theme) Overrides */
    body.light-mode {
      --bg-main: #0c1b33;
      /* Dark blue/black from image */
      --rock-border: #1d335c;
      /* Blue rock-like structure border */
      --text-primary: #e0f2fe;
      /* Light blue text */
      --logo-gold: #38bdf8;
      /* Blue 'gold' accent */

      /* --- THE BLUE FIRE EFFECT --- */
      /* Comment: Adjust these to change the blue flame color. */
      --flame-color-1: rgba(2, 132, 199, 0.7);
      /* Dark Cyan */
      --flame-color-2: rgba(56, 189, 248, 0.9);
      /* Bright Blue */
      --flame-color-3: rgba(224, 242, 254, 0.5);
      /* Light Blue/White (Core) */

      /* The image for the monster in Light mode */
      --monster-image: url('images/reaper-blue.png');
    }

    /* --- 2. BASE STYLES --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Verdana', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.4s, color 0.4s;
      overflow-x: hidden;
      position: relative;
      /* Essential for containing the reaper monster */
      min-height: 100vh;
    }

    /* --- 3. THE LIVE FIRE ANIMATION (THE MAIN REQUEST) --- */
    /* Comment: This '@keyframes' block is the engine for the movement. 
     It shifts the background position over 3 seconds, making the gradient 'flow'. */
    @keyframes fire-flow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Comment: This is the magical CSS trick for a moving gradient border.
     It uses a custom property ('border-image') and applies the animation. */
    .animated-fire-border {
      border-style: solid;
      border-width: 2px;

      /* Create a repeating gradient of flame colors */
      border-image: repeating-linear-gradient(-45deg,
          var(--flame-color-1) 0%,
          var(--flame-color-2) 20%,
          var(--flame-color-3) 50%,
          var(--flame-color-2) 80%,
          var(--flame-color-1) 100%) 1;

      /* Give the gradient a huge background size so it has room to 'move' */
      background-size: 300% 300%;

      /* Apply the movement animation defined above, infinitely and smoothly */
      animation: fire-flow 3s ease infinite;

      /* The final touch: A 'bloom' or 'glow' effect around the border using box-shadow */
      box-shadow: 0 0 15px var(--flame-color-2);
      transition: box-shadow 0.3s ease;
    }

    /* Extra effect when hovering over the overall rock structure */
    .animated-fire-border:hover {
      box-shadow: 0 0 25px var(--flame-color-1);
      /* Increase glow on hover */
    }

    /* --- 4. TOP NAVBAR LAYOUT --- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid var(--rock-border);
      /* Non-animated border for top */
      position: relative;
      z-index: 100;
    }

    /* Wallet/Menu Group */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .menu-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-primary);
      transition: color 0.2s;
    }

    .menu-btn:hover {
      color: var(--logo-gold);
    }

    .wallet {
      background-color: #111;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--rock-border);
    }

    /* Comment: ADD YOUR IMAGE HERE for the wallet coin icon */
    .wallet-icon {
      width: 70px;
      height: 60px;
      background-image: url('images/wallet-icon.png');
      /* Replace this */
      background-size: contain;
      background-repeat: no-repeat;
    }

    .wallet span {
      color: var(--logo-gold);
    }

    /* Logo Skull (Middle) */
    .nav-center .logo-skull {
      width: 150px;
      height: 120px;
      /* Comment: ADD YOUR IMAGE HERE for the skull with headphones */
      background-image: url('images/logo-skull.png');
      /* Replace this */
      background-size: contain;
      background-repeat: no-repeat;
    }

    /* Profile Group (Right) */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      background-color: var(--rock-border);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: box-shadow 0.2s;
    }

    .profile-icon:hover {
      box-shadow: 0 0 10px var(--flame-color-2);
    }

    /* The Profile Dropdown (Hidden initially) */
    .profile-dropdown {
      display: none;
      /* JS will change this to 'block' */
      position: absolute;
      right: 0;
      top: 55px;
      background-color: #141414;
      border: 1px solid var(--rock-border);
      width: 180px;
      border-radius: 8px;
      overflow: hidden;
    }

    .profile-dropdown.show {
      display: block;
    }

    .profile-dropdown a,
    .profile-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--text-primary);
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--rock-border);
    }

    .profile-dropdown a:hover,
    .profile-dropdown button:hover {
      background-color: var(--bg-main);
    }

    /* --- 5. MAIN PAGE CONTENT LAYOUT --- */
    .main-content {
      display: flex;
      padding: 30px;
    }

    /* --- 6. SIDEBAR LAYOUT --- */
    .sidebar {
      width: 200px;
      margin-right: 30px;
      /* JS will handle showing/hiding this, use 'hidden' class to push it off-screen smoothly */
      transition: transform 0.4s ease-out;
    }

    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      /* Take out of flow when hidden */
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li a {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 16px;
      transition: background 0.2s;
    }

    .sidebar li a:hover {
      background-color: #141414;
      border-left: 3px solid var(--logo-gold);
      color: var(--logo-gold);
    }

    /* Comment: Sidebar Icons. Set up one generic style, then unique icons per link. */
    .sidebar-icon {
      width: 18px;
      height: 18px;
      background-size: contain;
      background-repeat: no-repeat;
    }

    /* Comment: ADD YOUR IMAGES HERE for the menu icons (image paths are relative to this HTML file) */
    .icon-home {
      background-image: url('images/icon-home.png');
    }

    .icon-wallet {
      background-image: url('images/icon-wallet.png');
    }

    .icon-about {
      background-image: url('images/icon-about.png');
    }

    .icon-history {
      background-image: url('images/icon-history.png');
    }

    /* --- 7. GAMES GRID LAYOUT --- */
    .games-section {
      flex-grow: 1;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 900px;
      margin: 0 auto;
    }

    .game-card {
      background-color: #1a1a1a;
      border-radius: 12px;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      /* Contain the moving border and text */
    }

    /* Applying the Animated Fire Border to the Gaming Cards! */
    .game-card.fire {
      border-style: solid;
      border-width: 2px;
      border-image: repeating-linear-gradient(-45deg,
          var(--flame-color-1) 0%,
          var(--flame-color-2) 20%,
          var(--flame-color-3) 50%,
          var(--flame-color-2) 80%,
          var(--flame-color-1) 100%) 1;
      background-size: 300% 300%;
      animation: fire-flow 2.5s ease infinite;
      /* Faster animation for cards */
      box-shadow: 0 0 10px var(--flame-color-2);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    /* Hover 'Pop' Effect on Gaming Cards */
    .game-card:hover {
      transform: translateY(-5px) scale(1.03);
      /* Grow and move up */
      box-shadow: 0 8px 25px var(--flame-color-1);
      /* Larger and more intense color on hover */
      z-index: 10;
      /* Stack on top of other cards when hovered */
    }

    .game-card:hover .game-title {
      color: var(--logo-gold);
      /* Brighten title text on hover */
    }

    .card-placeholder {
      flex-grow: 1;
      background-color: rgba(255, 255, 255, 0.03);
      /* Slight visibility, you will add game images over this */
    }

    .game-title {
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      background-color: rgba(0, 0, 0, 0.5);
      /* Semi-transparent label background */
      border-top: 1px solid var(--rock-border);
      transition: color 0.3s;
    }

    /* --- 8. THE REAPER MONSTER (BOTTOM RIGHT) --- */
    /* Comment: This is the large monster image. It is placed absolutely 
     at the bottom right corner of the window. Its image automatically 
     changes when switching themes using the CSS variables. */
    .reaper-monster {
      position: fixed;
      /* Keep it visible even when scrolling */
      bottom: 0;
      right: 0;
      width: 250px;
      /* Large size */
      height: 300px;
      /* High enough to rise from the corner */

      /* Comment: Set up the PNG image here and ensure it is contained 
       properly and aligns to the very bottom-right corner. */
      background-image: var(--monster-image);
      /* Uses the CSS variables defined at top */
      background-size: contain;
      background-position: bottom right;
      background-repeat: no-repeat;

      z-index: 10;
      /* Put it slightly over other content */
      pointer-events: none;
      /* Ensure clicks pass THROUGH the reaper to the games behind it */
      transition: background-image 0.4s ease;
      /* Fade image smoothly on theme change */
    }

    /* Responsive Fix for mobile */
    @media (max-width: 900px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .sidebar {
        position: absolute;
      }

      /* Hide on smaller screens */
      .sidebar.show-on-mobile {
        transform: translateX(0);
        z-index: 50;
        height: 100vh;
        background-color: var(--bg-main);
        border: 2px solid var(--rock-border);
      }
    }

    @media (max-width: 600px) {
      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="nav-left">
      <button class="menu-btn" id="menuToggle">&#9776;</button>

      <div class="wallet animated-fire-border" style="cursor: pointer;" id="depositBtn" title="Deposit Funds">
        <div class="wallet-icon"></div>
        <span id="globalWalletSpan">₹0.00</span>
        <span
          style="font-size: 10px; color: #000; background: #1fff20; padding: 2px 5px; border-radius: 4px; margin-left: 5px; font-weight: bold;">+
          DEPOSIT</span>
      </div>
    </div>

    <div class="nav-center">
      <div class="logo-skull"></div>
    </div>

    <div class="nav-right">
      <div class="profile-icon animated-fire-border" id="profileToggle">&#128100;</div>

      <div class="profile-dropdown" id="profileDropdown">
        <a href="#">Settings</a>
        <button id="themeToggle">Toggle Mode</button>
        <a href="#" style="color: #ef4444;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="main-content">

    <aside class="sidebar hidden" id="sidebar">
      <div class="animated-fire-border" style="padding: 10px; border-radius: 8px;">
        <ul>
          <li><a href="#">
              <div class="sidebar-icon icon-home"></div> Home
            </a></li>
          <li><a href="#">
              <div class="sidebar-icon icon-wallet"></div> Wallet
            </a></li>
          <li><a href="#">
              <div class="sidebar-icon icon-about"></div> About
            </a></li>
          <li><a href="#">
              <div class="sidebar-icon icon-history"></div> History
            </a></li>
        </ul>
      </div>
    </aside>

    <section class="games-section">
      <div class="games-grid">
        <a href="games/mine.html?v=456" style="text-decoration: none; color: inherit;">
          <div class="game-card fire">
            <div class="card-placeholder"
              style="background-image: url('images/mines.png'); background-size: cover; background-position: center;">
            </div>
            <div class="game-title">Mines</div>
          </div>
        </a>
        <a href="games/dragon-tower.html" style="text-decoration: none; color: inherit;">
          <div class="game-card fire">
            <div class="card-placeholder"
              style="background-image: url('images/dragon.png'); background-size: cover; background-position: center;">
            </div>
            <div class="game-title">Dragon Tower</div>
          </div>
        </a>
        <a href="games/chicken-run.html" style="text-decoration: none; color: inherit;">
          <div class="game-card fire">
            <div class="card-placeholder"
              style="background-image: url('images/chicken-run.png'); background-size: cover; background-position: center;">
            </div>
            <div class="game-title">Chicken Run</div>
          </div>
        </a>
        <a href="games/tic-tac-toe.html" style="text-decoration: none; color: inherit;">
          <div class="game-card fire">
            <div class="card-placeholder"
              style="background-image: url('images/tic-tac-toe.png'); background-size: cover; background-position: center;">
            </div>
            <div class="game-title">Tic-Tac-Toe</div>
          </div>
        </a>
        <a href="games/memory-match.html" style="text-decoration: none; color: inherit;">
          <div class="game-card fire">
            <div class="card-placeholder"
              style="background-image: url('images/match.png'); background-size: cover; background-position: center;">
            </div>
            <div class="game-title">Memory Match</div>
          </div>
        </a>
        <a href="games/flip.html" style="text-decoration: none; color: inherit;">
          <div class="game-card fire">
            <div class="card-placeholder"
              style="background-image: url('images/flip.png'); background-size: cover; background-position: center;">
            </div>
            <div class="game-title">Flip</div>
          </div>
        </a>
      </div>
    </section>
  </div>

  <div class="reaper-monster"></div>

  <script>
    // Elements we need to control
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    const profileToggle = document.getElementById('profileToggle');
    const profileDropdown = document.getElementById('profileDropdown');

    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    // --- A. Sidebar Menu Toggle ---
    menuToggle.addEventListener('click', () => {
      // Toggle both the desktop and mobile views
      sidebar.classList.toggle('hidden');
      sidebar.classList.toggle('show-on-mobile');
    });

    // --- B. Profile Dropdown Menu Toggle ---
    profileToggle.addEventListener('click', (e) => {
      e.stopPropagation(); // Stop click from propagating immediately
      profileDropdown.classList.toggle('show');
    });

    // Close profile dropdown if clicked anywhere outside of it
    document.addEventListener('click', (e) => {
      if (profileDropdown.classList.contains('show') && e.target !== profileToggle) {
        profileDropdown.classList.remove('show');
      }
    });

    // --- C. Theme Toggle (Light/Blue & Dark/Red) ---
    themeToggle.addEventListener('click', () => {
      // Toggles the 'light-mode' class on the entire body.
      // This switches all CSS variables simultaneously!
      body.classList.toggle('light-mode');

      // Update the button text inside the menu so the user knows what will happen next
      if (body.classList.contains('light-mode')) {
        themeToggle.textContent = "theme Red Mode";
      } else {
        themeToggle.textContent = "theme Blue Mode";
      }
    });

    // --- DEPOSIT SYSTEM (Production Stub) ---
    document.getElementById('depositBtn').addEventListener('click', () => {
      const token = localStorage.getItem('access_token');
      if (!token) return;
      // Here you would integrate Stripe/Crypto/UPI.
      // For now, we will just stub an alert since it is secure without test money.
      alert("DEPOSIT GATEWAY OFFLINE: Production Payment API not configured yet.");
    });

    // --- Backend Wallet Fetch / Auth Protection ---
    async function updateDashboardWallet() {
      const token = localStorage.getItem('access_token');

      // Route Protection: Prevent unauthorized access
      if (!token) {
        window.location.href = "index.html";
        return;
      }

      try {
        const response = await fetch('http://127.0.0.1:8000/api/wallet/', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          const data = await response.json();
          const span = document.getElementById('globalWalletSpan');
          if (span) span.innerText = '₹' + data.wallet_balance.toFixed(2);

          // Temporary sync for HTML mini-games until they are connected to backend logic
          localStorage.setItem('walletBalance', data.wallet_balance.toFixed(2));
        } else {
          // Token expired or invalid
          localStorage.removeItem('access_token');
          window.location.href = "index.html";
        }
      } catch (error) {
        console.error("Backend offline or unreachable:", error);
      }
    }

    // Fetch immediately on load
    updateDashboardWallet();
    window.addEventListener('focus', updateDashboardWallet);
  </script>
</body>

</html>
