<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe - Game Zone</title>
<style>
  body { 
    background-color: #0f212e; /* Stake dark */
    color: #b1bad3; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; 
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden; 
  }
  
  /* Top Bar */
  .header { 
    display: flex; justify-content: space-between; padding: 15px 20px; 
    background: #1a2c38;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    align-items: center;
    flex-shrink: 0;
  }
  .btn-back { background: #2f4553; color: #b1bad3; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: background 0.2s; }
  .btn-back:hover { background: #3d5566; color: white; }
  
  .wallet-disp { font-size: 16px; font-weight: bold; color: white; padding: 5px 15px; border-radius: 4px; display: flex; align-items: center; gap: 10px; background: transparent;}
  .wallet-disp .icon { width: 24px; height: 24px; background: url('../images/wallet-icon.png') no-repeat center/contain; }
  
  /* Main Container */
  .game-wrapper {
    display: flex;
    flex: 1;
    justify-content: flex-start;
    align-items: stretch;
    padding: 20px;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Left Controls Sidebar */
  .controls-sidebar {
    width: 300px;
    background-color: #213743;
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
    overflow-y: auto;
  }

  /* Input Groups */
  .input-label { font-size: 13px; margin-bottom: 5px; font-weight: 600; color: #b1bad3; display: flex; justify-content: space-between; }
  .input-box { background: #0f212e; border: 2px solid transparent; border-radius: 4px; display: flex; align-items: center; transition: 0.2s; }
  .input-box:focus-within { border-color: #2f4553; }
  .input-box input, .input-box select { background: transparent; border: none; color: white; padding: 12px; font-weight: 600; font-size: 14px; width: 100%; outline: none; flex: 1; -moz-appearance: textfield; appearance: textfield; }
  .input-box input::-webkit-outer-spin-button, .input-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .input-addon { padding: 0 10px; color: #b1bad3; display: flex; align-items: center; gap: 5px; font-weight: bold; }
  
  .bet-notice { font-size:11px; color:#facc15; margin-top:-5px; }

  /* Buttons */
  .bet-btn { background: #256bf5; color: white; border: none; padding: 16px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
  .bet-btn.cashout { background: #1fff20; color: #000; box-shadow: 0 0 10px rgba(31, 255, 32, 0.4); }
  .bet-btn.active-bet { background: #2f4553; color: white; cursor: not-allowed; }
  .bet-btn:hover:not(.active-bet) { opacity: 0.9; }

  /* Right Game Area */
  .game-area {
    flex: 1;
    background-color: #0b1821;
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    flex-direction: column;
  }

  /* Tic-Tac-Toe Grid */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 120px);
    grid-template-rows: repeat(3, 120px);
    gap: 10px;
    background: #2f4553; /* Border color technically */
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    pointer-events: none; /* disabled by default */
    opacity: 0.5;
    transition: 0.3s;
  }
  .board.active { pointer-events: auto; opacity: 1; }
  
  .cell {
    background: #0f212e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  .cell:hover { background: #1a2c38; }
  .cell.taken { cursor: default; }

  .cell.x-mark { color: #facc15; text-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
  .cell.o-mark { color: #5e7bf5; text-shadow: 0 0 15px rgba(94, 123, 245, 0.4); }
  .cell.win-highlight { background: #214032; border: 2px solid #00e701; box-shadow: 0 0 20px rgba(0,231,1,0.3); }

  /* Status Overlay */
  .status-overlay {
    position: absolute; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    inset: 0; pointer-events: none; z-index: 20;
    background: rgba(0,0,0,0.6);
  }
  .status-banner {
    background: #1fff20; color: #000; padding: 15px 40px; border-radius: 8px; font-size: 24px; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: center;
    animation: popIn 0.3s forwards;
  }
  .status-banner.loss { background: #ff2a2a; color: white; }
  .status-banner.draw { background: #facc15; color: black; }
  .status-sub { font-size: 16px; margin-top: 5px; opacity: 0.8; font-weight:bold; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

  @media (max-width: 850px) {
    .game-wrapper { flex-direction: column-reverse; overflow-y: auto; }
    .controls-sidebar { width: 100%; }
    .game-area { min-height: 500px; }
    .board { grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); }
    .cell { font-size: 45px; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="../dashboard.html" class="btn-back">← Back</a>
  <div class="wallet-disp">
    <div class="icon"></div>
    <span id="walletText">₹0.00</span>
  </div>
</div>

<div class="game-wrapper">
  <!-- Sidebar -->
  <div class="controls-sidebar">

    <!-- Bet Amount -->
    <div>
      <div class="input-label"><span>Bet Amount</span><span id="maxBetInfo" style="color:#1fff20;cursor:pointer;">₹0.00</span></div>
      <div class="input-box">
        <div class="input-addon">₹</div>
        <input type="number" id="betAmount" value="50.00" min="0" step="0.01">
      </div>
      <div class="bet-notice">Bet limits: ₹0 OR ₹50 - ₹100</div>
    </div>

    <!-- Difficulty -->
    <div>
      <div class="input-label">CPU Difficulty</div>
      <div class="input-box">
        <select id="difficultySelect">
          <option value="easy">Easy (1.50x Payout)</option>
          <option value="medium" selected>Medium (2.00x Payout)</option>
          <option value="hard">Hard (5.00x Payout)</option>
        </select>
        <div class="input-addon">▼</div>
      </div>
    </div>

    <button class="bet-btn" id="betBtn">Bet vs CPU</button>

    <!-- Profit Indicator -->
    <div style="margin-top:20px;">
      <div class="input-label"><span>Total Profit (<span id="currentMultiLabel">0.00</span>×)</span></div>
      <div class="input-box" style="background:#1a2c38;">
        <div class="input-addon">₹</div>
        <input type="text" id="totalProfit" value="0.00" disabled style="color:#1fff20;">
      </div>
    </div>
  </div>

  <!-- Game Area -->
  <div class="game-area">
    
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    
    <div class="status-overlay" id="statusOverlay">
      <div class="status-banner" id="statusBanner">
        <div id="statusTitle">WIN</div><div class="status-sub" id="statusSub">Multiplier</div>
      </div>
    </div><script>
  // DOM Error Injector
  function panic(title, details) {
    document.body.innerHTML = `
      <div style="background:#ff2a2a; color:white; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 40px;">
        <h1 style="font-size: 50px; margin-bottom: 20px;">🚨 ${title}</h1>
        <p style="font-size: 24px;">${details}</p>
        <button onclick="window.location.reload()" style="margin-top:40px; padding:20px 40px; font-size: 20px; cursor:pointer; color:black;">Reload Game</button>
      </div>`;
    throw new Error(title + " | " + details);
  }

  const token = localStorage.getItem('access_token');
  if (!token) window.location.href = "../index.html";

  async function apiFetch(endpoint, method, body) {
    let res;
    try {
      res = await fetch(`https://backend-xpnz.onrender.com/api/games/tictactoe/${endpoint}/`, {
        method: method,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
    } catch(e) {
      panic("API OFFLINE", "Node server unreachable: " + e.message);
    }
    if (res.status === 401) {
       localStorage.removeItem('access_token');
       panic("SESSION EXPIRED", "Please log in again.");
    }
    return res;
  }

  /* --- WALLET --- */
  let walletBalance = parseFloat(localStorage.getItem('walletBalance')) || 0;
  
  const walletText = document.getElementById('walletText');
  const maxBetInfo = document.getElementById('maxBetInfo');
  function updateWalletDisplay() {
    walletText.innerText = '₹' + walletBalance.toFixed(2);
    maxBetInfo.innerText = '₹' + walletBalance.toFixed(2);
    localStorage.setItem('walletBalance', walletBalance.toFixed(2));
  }
  updateWalletDisplay();

  /* --- UI COMPONENTS --- */
  const betAmountInput = document.getElementById('betAmount');
  const betBtn = document.getElementById('betBtn');
  const difficultySelect = document.getElementById('difficultySelect');
  const totalProfitInput = document.getElementById('totalProfit');
  const currentMultiLabel = document.getElementById('currentMultiLabel');
  
  const boardEl = document.getElementById('board');
  const cells = document.querySelectorAll('.cell');
  
  const statusOverlay = document.getElementById('statusOverlay');
  const statusBanner = document.getElementById('statusBanner');
  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSub');

  /* --- STATE --- */
  let isPlaying = false;
  let activeGameId = null;
  let currentBet = 0;
  let boardState = Array(9).fill(null);
  let playerSymbol = 'X';
  let cpuSymbol = 'O';
  let isPlayerTurn = true;
  let currentMultiConfig = { easy: 1.5, medium: 2.0, hard: 5.0 };

  /* --- BET BUTTON --- */
  betBtn.addEventListener('click', () => {
    if (isPlaying) return;
    startGame();
  });

  maxBetInfo.onclick = () => { if(!isPlaying) { betAmountInput.value = walletBalance.toFixed(2); } }

  async function startGame() {
    let bet = parseFloat(betAmountInput.value);
    if (isNaN(bet) || bet < 0) bet = 0;
    
    if (bet !== 0 && (bet < 50 || bet > 100)) {
      alert("Bet must be exactly ₹0.00, or between ₹50.00 and ₹100.00!");
      return;
    }
    
    if (walletBalance < bet && bet > 0) {
      if(walletBalance === 0) { bet = 0; betAmountInput.value = "0.00"; } 
      else { 
         if(walletBalance < 50 && walletBalance > 0) {
             bet = 0; betAmountInput.value = "0.00";
             alert("Balance too low for minimum ₹50 bet. Forcing ₹0 bet.");
         } else if (walletBalance > 100) {
             bet = 100; betAmountInput.value = "100.00";
         } else {
             bet = walletBalance; betAmountInput.value = bet.toFixed(2); 
         }
      }
    }
    
    let diff = difficultySelect.value;
    
    betAmountInput.disabled = difficultySelect.disabled = true;
    betBtn.disabled = true;
    betBtn.innerText = 'CONNECTING...';

    const res = await apiFetch('start', 'POST', { bet: bet, difficulty: diff });
    let data;
    try { data = await res.json(); } catch(e) { panic("SERVER CORRUPTION", "Invalid JSON payload mapping."); }
    
    if (!res.ok) {
       alert(data.detail || "Failed to start server-side game.");
       betAmountInput.disabled = difficultySelect.disabled = false;
       betBtn.disabled = false;
       betBtn.innerText = 'Bet vs CPU';
       return;
    }

    activeGameId = data.game_id;
    walletBalance = parseFloat(data.wallet_balance);
    updateWalletDisplay();
    
    currentBet = bet;
    
    betBtn.className = 'bet-btn active-bet';
    betBtn.disabled = false;
    betBtn.innerText = 'Match in Progress...';
    
    totalProfitInput.value = "0.00";
    currentMultiLabel.innerText = "0.00";
    statusOverlay.style.display = 'none';
    
    boardState = Array(9).fill(null);
    cells.forEach(c => {
      c.innerText = '';
      c.className = 'cell';
    });
    
    isPlaying = true;
    isPlayerTurn = true;
    boardEl.classList.add('active');
  }

  /* --- GAME MECHANICS --- */
  cells.forEach(c => {
    c.addEventListener('click', () => {
      if (!isPlaying || !isPlayerTurn) return;
      let idx = parseInt(c.getAttribute('data-index'));
      
      if (boardState[idx] === null) {
        processServerMove(idx, c);
      }
    });
  });

  function makeMoveVisual(idx, symbol) {
    boardState[idx] = symbol;
    let cellEl = document.querySelector(`.cell[data-index='${idx}']`);
    cellEl.innerText = symbol;
    cellEl.classList.add('taken');
    cellEl.classList.add(symbol === 'X' ? 'x-mark' : 'o-mark');
  }

  async function processServerMove(idx, cellEl) {
    if (!activeGameId) panic("GAME ID LOST", "Out of sync.");
    
    isPlayerTurn = false;
    makeMoveVisual(idx, playerSymbol);
    
    const res = await apiFetch('move', 'POST', { game_id: activeGameId, spot_idx: idx });
    let data;
    try { data = await res.json(); } catch(e) { panic("MOVE CRASHED", "Node server exploded during lookup!"); }
    
    if (!res.ok) {
       panic("ERROR", data.detail || "Server rejected move.");
       return;
    }

    // Server might return cpu_move if state is playing, loss, or draw (if CPU made the drawing move)
    if (data.cpu_move !== undefined && data.cpu_move !== null) {
        setTimeout(() => {
           makeMoveVisual(data.cpu_move, cpuSymbol);
           handleFinalState(data);
        }, 500); // UI delay for effect
    } else {
        handleFinalState(data);
    }
  }

  function handleFinalState(data) {
    if (data.status === 'playing') {
       isPlayerTurn = true;
       return;
    }
    
    // Game is over (win, loss, or draw)
    isPlaying = false;
    boardEl.classList.remove('active');
    
    betAmountInput.disabled = difficultySelect.disabled = false;
    betBtn.className = 'bet-btn';
    betBtn.innerText = 'Bet vs CPU';

    if (data.status === 'win') {
       let diff = difficultySelect.value;
       let multi = currentMultiConfig[diff];
       
       walletBalance = parseFloat(data.wallet_balance || walletBalance + data.payout); 
       updateWalletDisplay();
       
       totalProfitInput.value = data.payout.toFixed(2);
       currentMultiLabel.innerText = multi.toFixed(2);
       
       cells.forEach(c => {
         if(c.innerText === playerSymbol) c.classList.add('win-anim');
       });
       showBanner(`${multi.toFixed(2)}x`, `Payout ₹${data.payout.toFixed(2)}`, false);
    } 
    else if (data.status === 'loss') {
       totalProfitInput.value = "0.00";
       currentMultiLabel.innerText = "0.00";
       cells.forEach(c => {
         if(c.innerText === cpuSymbol) c.classList.add('loss-anim');
       });
       showBanner("LOSS", "AI Prevails", true);
    }
    else if (data.status === 'draw') {
       walletBalance = parseFloat(data.wallet_balance || walletBalance + data.payout);
       updateWalletDisplay();
       
       totalProfitInput.value = data.payout.toFixed(2);
       currentMultiLabel.innerText = "1.00";
       showBanner("DRAW", "Bet Returned", false);
    }
  }

  function showBanner(title, sub, isLoss) {
    statusBanner.className = isLoss ? 'status-banner loss' : 'status-banner';
    statusTitle.innerText = title;
    statusSub.innerText = sub;
    statusOverlay.style.display = 'flex';
  }

</script>
</body>
</html>
