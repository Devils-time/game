<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Tower - Game Zone</title>
<style>
  body { 
    background-color: #0f212e; /* Stake dark blue-grey background */
    color: #b1bad3; /* Stake text color */
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; 
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Top Bar */
  .header { 
    display: flex; justify-content: space-between; padding: 15px 20px; 
    background: #1a2c38;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    align-items: center;
  }
  .btn-back { background: #2f4553; color: #b1bad3; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: background 0.2s; }
  .btn-back:hover { background: #3d5566; color: white; }
  
  .wallet-disp { font-size: 16px; font-weight: bold; color: white; padding: 5px 15px; border-radius: 4px; display: flex; align-items: center; gap: 10px; background: transparent;}
  .wallet-disp .icon { width: 24px; height: 24px; background: url('../images/wallet-icon.png') no-repeat center/contain; }
  
  /* Main Container */
  .game-wrapper {
    display: flex;
    flex: 1;
    justify-content: center;
    align-items: stretch;
    padding: 20px;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  /* Left Controls Sidebar */
  .controls-sidebar {
    width: 300px;
    background-color: #213743;
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, 0.05);
  }

  /* Toggles */
  .toggle-group {
    display: flex;
    background: #0f212e;
    border-radius: 54px;
    padding: 2px;
  }
  .toggle-btn {
    flex: 1; text-align: center; padding: 10px; color: #b1bad3; font-weight: 600; cursor: pointer; border-radius: 54px; transition: 0.2s; font-size: 14px;
  }
  .toggle-btn.active {
    background: #2f4553; color: white;
  }

  /* Input Groups */
  .input-label { font-size: 13px; margin-bottom: 5px; font-weight: 600; color: #b1bad3; display: flex; justify-content: space-between; }
  .input-box {
    background: #0f212e;
    border: 2px solid transparent; 
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: 0.2s;
  }
  .input-box:focus-within { border-color: #2f4553; }
  .input-box input, .input-box select {
    background: transparent; border: none; color: white; padding: 12px; font-weight: 600; font-size: 14px; width: 100%; outline: none; flex: 1;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .input-box input::-webkit-outer-spin-button,
  .input-box input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  
  .input-addon {
    padding: 0 10px; color: #b1bad3; display: flex; align-items: center; gap: 5px; font-weight: bold;
  }
  
  .action-btns { display: flex; position: relative; }
  .action-btns button {
    background: #2f4553; color: white; border: none; padding: 0 12px; font-weight: 600; cursor: pointer; border-left: 1px solid #0f212e; transition: 0.2s;
  }
  .action-btns button:first-child { border-left: none; }
  .action-btns button:hover { background: #3d5566; }

  /* Main Bet Button */
  .bet-btn {
    background-color: #256bf5;
    background: #256bf5;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 4px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 5px;
    height: 56px;
  }
  .bet-btn.active { background: #2f4553; color: white; cursor: not-allowed;}
  .bet-btn.cashout { background: #256bf5; }
  .bet-btn:hover:not(.active) { background: #3b7dff; }
  
  .random-btn {
    background: #2f4553; color: white; padding: 12px; border-radius: 4px; font-weight:600; cursor:pointer; font-size:14px; border:none; transition:0.2s;
  }
  .random-btn:hover { background: #3d5566; }
  .random-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Right Game Area */
  .game-area {
    flex: 1;
    background-color: #0f212e;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    position: relative;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* The animated background behind the tower */
  .game-area::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, #1a2c38 0%, #0f212e 70%);
  }

  /* The actual tower grid */
  .tower-container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column-reverse; /* Row 0 at bottom */
    gap: 8px;
    position: relative;
    z-index: 1;
  }

  .tower-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
  }

  .tile {
    flex: 1;
    background-color: #2f4553;
    border-radius: 6px;
    height: 40px; /* Slimmer for 9 rows */
    cursor: pointer;
    transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s, opacity 0.3s;
    box-shadow: 0 4px 0 0 #213743;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(0);
    position: relative;
    user-select: none;
    opacity: 0.5; /* Inactive by default */
  }
  
  /* The active row logic */
  .tower-row.active .tile {
    opacity: 1;
  }
  .tower-row.active .tile:not(.revealed):hover {
    background-color: #3d5566;
    transform: translateY(-2px);
    box-shadow: 0 6px 0 0 #213743;
  }
  .tower-row.active .tile:active:not(.revealed) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 0 #213743;
  }

  /* Cleared Rows */
  .tower-row.cleared .tile {
    opacity: 1;
    cursor: default;
  }

  .tile.revealed {
    background-color: #0f212e;
    box-shadow: none;
    cursor: default;
    transform: translateY(4px);
  }
  
  /* Emojis matching the safe egg or skull */
  .tile .icon-img { 
    font-size: 24px; 
    opacity: 0; 
    transition: opacity 0.2s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    transform: scale(0.5); 
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .tile.revealed .icon-img { opacity: 1; transform: scale(1); }
  
  .tile.revealed.egg { background-color: #071824; }
  .tile.revealed.skull { background-color: #2a0a0a; border: 1px solid #ff2a2a; }
  
  .tile.exploded { background-color: #3b0a0a !important; box-shadow: 0 0 15px #ff2a2a; }

  /* Multiplier popup element right next to active row (optional) */
  .row-multiplier {
    position: absolute;
    right: -60px;
    color: #00e701;
    font-weight: bold;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    transform: translateX(-10px);
  }
  .tower-row.active .row-multiplier {
    opacity: 1;
    transform: translateX(0);
  }

  /* Status Overlay */
  .status-overlay {
    position: absolute; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    inset: 0; pointer-events: none; z-index: 20;
    animation: fadeIn 0.3s forwards;
  }
  .status-banner {
    background: #00e701; color: #000; padding: 15px 40px; border-radius: 8px; font-size: 24px; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    text-align: center;
  }
  .status-banner.loss { background: #ff2a2a; color: white; }

  .status-sub { font-size: 16px; margin-top: 5px; opacity: 0.8; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* Responsive styling */
  @media (max-width: 850px) {
    .game-wrapper { flex-direction: column-reverse; }
    .controls-sidebar { width: 100%; box-sizing: border-box; }
    .row-multiplier { display: none; /* Hide on small screens where it overlaps */ }
  }

</style>
</head>
<body>

<div class="header">
  <a href="../dashboard.html" class="btn-back">← Back</a>
  <div class="wallet-disp">
    <div class="icon"></div>
    <span id="walletText">₹0.00</span>
  </div>
</div>

<div class="game-wrapper">
  <!-- Sidebar -->
  <div class="controls-sidebar">
    <div class="toggle-group">
      <div class="toggle-btn active" id="manualToggle">Manual</div>
      <div class="toggle-btn" id="autoToggle">Auto</div>
    </div>

    <!-- Bet Amount -->
    <div>
      <div class="input-label"><span>Bet Amount</span><span id="maxBetInfo" style="color:#00e701;cursor:pointer;">₹0.00</span></div>
      <div class="input-box">
        <div class="input-addon">₹</div>
        <input type="number" id="betAmount" value="0.00" min="0" step="0.01">
        <div class="action-btns">
          <button id="btnHalf">½</button>
          <button id="btnDouble">2×</button>
        </div>
      </div>
    </div>

    <!-- Difficulty Dropdown -->
    <div>
      <div class="input-label">Difficulty</div>
      <div class="input-box">
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <div class="input-addon">▼</div>
      </div>
    </div>

    <button class="bet-btn" id="betBtn">Bet</button>
    <button class="random-btn" id="randomBtn" disabled>Random Pick</button>

    <!-- Profit Indicator -->
    <div>
      <div class="input-label"><span>Total Profit (<span id="currentMultiLabel">0.00</span>×)</span></div>
      <div class="input-box" style="background:#1a2c38;">
        <div class="input-addon">₹</div>
        <input type="text" id="totalProfit" value="0.00" disabled style="color:#00e701;">
      </div>
    </div>

  </div>

  <!-- Game Area -->
  <div class="game-area">
    <div class="tower-container" id="towerContainer">
      <!-- Generated by JS -->
    </div>
    
    <div class="status-overlay" id="statusOverlay">
      <div class="status-banner" id="statusBanner">
        <div id="statusTitle">1.25x</div>
        <div class="status-sub" id="statusSub">Multiplier</div>
      </div>
    </div>
  </div>
</div>

<script>
  // DOM Error Injector
  function panic(title, details) {
    document.body.innerHTML = `
      <div style="background:#ff2a2a; color:white; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 40px;">
        <h1 style="font-size: 50px; margin-bottom: 20px;">🚨 ${title}</h1>
        <p style="font-size: 24px;">${details}</p>
        <button onclick="window.location.reload()" style="margin-top:40px; padding:20px 40px; font-size: 20px; cursor:pointer; color:black;">Reload Game</button>
      </div>`;
    throw new Error(title + " | " + details);
  }

  // API Wrapper
  const token = localStorage.getItem('access_token');
  if (!token) window.location.href = "../index.html";

  async function apiFetch(endpoint, method, body) {
    let res;
    try {
      res = await fetch(`https://backend-xpnz.onrender.com/api/games/tower/${endpoint}/`, {
        method: method,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
    } catch(e) {
      panic("API OFFLINE", "Node server unreachable: " + e.message);
    }
    if (res.status === 401) {
       localStorage.removeItem('access_token');
       panic("SESSION EXPIRED", "Please log in again.");
    }
    return res;
  }

  /* --- WALLET SIMULATION --- */
  let walletBalance = parseFloat(localStorage.getItem('walletBalance')) || 0;
  
  const walletText = document.getElementById('walletText');
  const maxBetInfo = document.getElementById('maxBetInfo');
  
  function updateWalletDisplay() {
    walletText.innerText = '₹' + walletBalance.toFixed(2);
    maxBetInfo.innerText = '₹' + walletBalance.toFixed(2);
    localStorage.setItem('walletBalance', walletBalance.toFixed(2));
  }
  updateWalletDisplay();

  /* --- UI ELEMENTS --- */
  const betAmountInput = document.getElementById('betAmount');
  const btnHalf = document.getElementById('btnHalf');
  const btnDouble = document.getElementById('btnDouble');
  const difficultySelect = document.getElementById('difficultySelect');
  const betBtn = document.getElementById('betBtn');
  const randomBtn = document.getElementById('randomBtn');
  const totalProfitInput = document.getElementById('totalProfit');
  const currentMultiLabel = document.getElementById('currentMultiLabel');
  const towerContainer = document.getElementById('towerContainer');
  
  const statusOverlay = document.getElementById('statusOverlay');
  const statusBanner = document.getElementById('statusBanner');
  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSub');

  /* --- MATH & CONFIG --- */
  const ROWS = 9;
  
  const diffMap = {
    'easy': { cols: 4 },
    'medium': { cols: 3 },
    'hard': { cols: 2 }
  };
  
  function getProb(difficulty) {
    let cols = diffMap[difficulty].cols;
    return (cols - 1) / cols; 
  }

  function getMultiplier(difficulty, level) {
    if (level === 0) return 0.00;
    
    let prob = getProb(difficulty);
    let totalProb = Math.pow(prob, level);
    
    let multiplier = (1 / totalProb) * 0.99;
    return Math.floor(multiplier * 100) / 100;
  }

  /* --- GAME STATE --- */
  let isPlaying = false;
  let activeGameId = null;
  let currentDifficulty = 'medium';
  let currentCols = 3;
  let currentRow = 0; 
  let currentBet = 0;
  let currentMulti = 0.00;

  difficultySelect.addEventListener('change', (e) => {
    if (isPlaying) return;
    currentDifficulty = e.target.value;
    currentCols = diffMap[currentDifficulty].cols;
    drawTower();
  });

  /* --- BET BUTTON LOGIC --- */
  btnHalf.onclick = () => { if(!isPlaying) { let v = parseFloat(betAmountInput.value)/2; betAmountInput.value = (v>0?v:0).toFixed(2); } };
  btnDouble.onclick = () => { if(!isPlaying) { let v = parseFloat(betAmountInput.value)*2; betAmountInput.value = (v>0?v:0).toFixed(2); } };
  
  maxBetInfo.onclick = () => {
    if(!isPlaying) { betAmountInput.value = walletBalance.toFixed(2); }
  }

  betBtn.addEventListener('click', () => {
    if (!isPlaying) {
      startGame();
    } else {
      cashout();
    }
  });
  
  randomBtn.addEventListener('click', () => {
    if (!isPlaying) return;
    pickRandomTile(currentRow);
  });

  function drawTower() {
    towerContainer.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      let rowDiv = document.createElement('div');
      rowDiv.className = 'tower-row';
      rowDiv.dataset.row = r;
      
      for (let c = 0; c < currentCols; c++) {
        let t = document.createElement('div');
        t.className = 'tile';
        t.dataset.r = r;
        t.dataset.c = c;
        
        let icon = document.createElement('div');
        icon.className = 'icon-img';
        icon.innerText = '';
        t.appendChild(icon);

        t.onclick = () => handleTileClick(r, c);
        rowDiv.appendChild(t);
      }
      
      let multiHint = document.createElement('div');
      multiHint.className = 'row-multiplier';
      multiHint.innerText = getMultiplier(currentDifficulty, r+1).toFixed(2) + '×';
      rowDiv.appendChild(multiHint);
      
      towerContainer.appendChild(rowDiv);
    }
    statusOverlay.style.display = 'none';
  }

  function getTileElement(r, c) {
    return document.querySelector(`[data-r='${r}'][data-c='${c}']`);
  }

  function setActiveRow(r) {
    document.querySelectorAll('.tower-row').forEach(row => {
      let rIdx = parseInt(row.dataset.row);
      row.classList.remove('active', 'cleared');
      if (rIdx < r && isPlaying) {
        row.classList.add('cleared');
      } else if (rIdx === r && isPlaying) {
        row.classList.add('active');
      }
    });
  }

  async function startGame() {
    let bet = parseFloat(betAmountInput.value);
    if (isNaN(bet) || bet < 0) bet = 0;
    
    currentDifficulty = difficultySelect.value;
    currentCols = diffMap[currentDifficulty].cols;
    
    betAmountInput.disabled = true;
    difficultySelect.disabled = true;
    btnHalf.disabled = true;
    btnDouble.disabled = true;
    betBtn.disabled = true;
    betBtn.innerText = 'CONNECTING...';
    
    const res = await apiFetch('start', 'POST', { bet: bet, difficulty: currentDifficulty });
    let data;
    try { data = await res.json(); } catch(e) { panic("SERVER CORRUPTION", "Invalid JSON payload mapping."); }
    
    if (!res.ok) {
       alert(data.detail || "Failed to start server-side game.");
       betAmountInput.disabled = false;
       difficultySelect.disabled = false;
       btnHalf.disabled = false;
       btnDouble.disabled = false;
       betBtn.disabled = false;
       betBtn.innerText = 'Bet';
       return;
    }

    activeGameId = data.game_id;
    walletBalance = parseFloat(data.wallet_balance);
    updateWalletDisplay();

    currentBet = bet;
    currentRow = 0;
    currentMulti = 0.00; 
    isPlaying = true;
    
    drawTower();
    setActiveRow(currentRow);
    randomBtn.disabled = false;
    
    updateProfitUI();
    
    betBtn.className = 'bet-btn active';
    betBtn.style.backgroundColor = "#ff9800";
    betBtn.innerText = 'CLIMB ->';
    betBtn.disabled = false;
  }

  function updateProfitUI() {
    let payout = currentBet * currentMulti;
    totalProfitInput.value = payout.toFixed(2);
    currentMultiLabel.innerText = currentMulti.toFixed(2);
  }

  async function handleTileClick(r, c) {
    if (!isPlaying) return;
    if (r !== currentRow) return; // Only active row is clickable
    if (!activeGameId) panic("GAME ID LOST", "Out of sync.");
    
    let t = getTileElement(r, c);
    if (t.classList.contains('revealed') || t.classList.contains('processing')) return;
    
    t.classList.add('processing');
    
    const res = await apiFetch('click', 'POST', { game_id: activeGameId, r_idx: r, c_idx: c });
    let data;
    try { data = await res.json(); } catch(e) { panic("CLICK CRASHED", "Node server exploded during tower lookup!"); }
    
    t.classList.remove('processing');
    
    if (!res.ok) {
       panic("TILE ERROR", data.detail || "Server rejected row climb.");
       return;
    }
    
    if(data.status === 'exploded') {
       revealSkull(t, r, c, true);
       triggerLoss(data.secret_tower);
    } else {
       // Safe Egg
       currentMulti = parseFloat(data.multiplier);
       currentRow = data.current_row;
       revealEgg(t, r, c, data.bomb_col);
       
       if (data.status === 'cashed_out') {
           walletBalance = parseFloat(data.wallet_balance);
           updateWalletDisplay();
           triggerCashoutEnd(data.payout, data.secret_tower);
       }
    }
  }
  
  function pickRandomTile(r) {
    let pick = Math.floor(Math.random() * currentCols);
    handleTileClick(r, pick);
  }

  function revealEgg(tile, r, c, dummyBombCol) {
    tile.classList.add('revealed', 'egg');
    let icon = tile.querySelector('.icon-img');
    icon.innerText = '🥚';
    
    updateProfitUI();

    let payout = currentBet * currentMulti;
    betBtn.className = 'bet-btn cashout';
    betBtn.style.backgroundColor = "#1fff20";
    betBtn.innerText = `Cashout ₹${payout.toFixed(2)}`;
    
    setActiveRow(currentRow);
      
    // Auto-reveal skull in cleared row (faded) from server explicitly!
    let skullTile = getTileElement(r, dummyBombCol);
    skullTile.classList.add('revealed', 'skull');
    let skIcon = skullTile.querySelector('.icon-img');
    skIcon.innerText = '💀';
    skIcon.style.opacity = '0.3'; 
  }

  function revealSkull(tile, r, c, causedLoss = false) {
    tile.classList.add('revealed', 'skull');
    if (causedLoss) tile.classList.add('exploded');
    
    let icon = tile.querySelector('.icon-img');
    icon.innerText = '💀';
  }

  function triggerLoss(secretBoard) {
    isPlaying = false;
    randomBtn.disabled = true;
    
    // Reveal all remaining skulls up to top
    for(let rIdx = currentRow; rIdx < ROWS; rIdx++) {
      let skullCol = secretBoard[rIdx];
      let t = getTileElement(rIdx, skullCol);
      if(!t.classList.contains('revealed')) {
         t.classList.add('revealed', 'skull');
         var icon = t.querySelector('.icon-img');
         icon.innerText = '💀';
         icon.style.opacity = '0.5';
      }
    }
    setActiveRow(-1); // remove active class

    // Reset button
    betBtn.className = 'bet-btn';
    betBtn.style.backgroundColor = "#ff9800";
    betBtn.innerText = 'Bet';
    totalProfitInput.value = "0.00";
    currentMultiLabel.innerText = "0.00";
    
    // Enable inputs
    betAmountInput.disabled = false;
    difficultySelect.disabled = false;
    btnHalf.disabled = false;
    btnDouble.disabled = false;
    
    // Show banner
    showBanner("0.00x", "Multiplier", true);
  }

  async function cashout() {
    if (!isPlaying || currentRow === 0) return; // Cannot cashout at row 0
    if (!activeGameId) return;

    betBtn.disabled = true;
    betBtn.innerText = 'CASHING OUT...';

    const res = await apiFetch('cashout', 'POST', { game_id: activeGameId });
    let data;
    try { data = await res.json(); } catch(e) { panic("CASHOUT CRASHED", "Node server failed cashout transaction!"); }

    if (!res.ok) {
        panic("CASHOUT ERROR", data.detail || "Server rejected cashout.");
        return;
    }

    walletBalance = parseFloat(data.wallet_balance);
    updateWalletDisplay();
    triggerCashoutEnd(data.payout, data.secret_tower);
  }

  function triggerCashoutEnd(payout, secretBoard) {
    isPlaying = false;
    randomBtn.disabled = true;
    
    // Reveal rest of skulls
    for(let rIdx = currentRow; rIdx < ROWS; rIdx++) {
      let skullCol = secretBoard[rIdx];
      let t = getTileElement(rIdx, skullCol);
      if(!t.classList.contains('revealed')) {
         t.classList.add('revealed', 'skull');
         var icon = t.querySelector('.icon-img');
         icon.innerText = '💀';
         icon.style.opacity = '0.5';
      }
    }
    setActiveRow(-1);

    // Reset button
    betBtn.className = 'bet-btn';
    betBtn.style.backgroundColor = "#ff9800";
    betBtn.innerText = 'Bet';
    betBtn.disabled = false;
    
    // Enable inputs
    betAmountInput.disabled = false;
    difficultySelect.disabled = false;
    btnHalf.disabled = false;
    btnDouble.disabled = false;
    
    // Show banner
    showBanner(`${currentMulti.toFixed(2)}x`, `Payout ₹${payout.toFixed(2)}`, false);
  }
  
  function updateProfitUI() {
    let payout = currentBet * currentMulti;
    totalProfitInput.value = payout.toFixed(2);
    currentMultiLabel.innerText = (currentMulti === 0 ? "0.00" : currentMulti.toFixed(2));
  }
  
  function showBanner(title, sub, isLoss) {
    statusBanner.className = isLoss ? 'status-banner loss' : 'status-banner';
    statusTitle.innerText = title;
    statusSub.innerText = sub;
    statusOverlay.style.display = 'flex';
  }

  // Startup
  drawTower();
  
</script>
</body>
</html>
