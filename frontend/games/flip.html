<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip - Game Zone</title>
<style>
  body { 
    background-color: #0f212e; /* Stake dark */
    color: #b1bad3; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; 
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden; 
  }
  
  /* Top Bar */
  .header { 
    display: flex; justify-content: space-between; padding: 15px 20px; 
    background: #1a2c38;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    align-items: center;
    flex-shrink: 0;
  }
  .btn-back { background: #2f4553; color: #b1bad3; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; transition: background 0.2s; }
  .btn-back:hover { background: #3d5566; color: white; }
  
  .wallet-disp { font-size: 16px; font-weight: bold; color: white; padding: 5px 15px; border-radius: 4px; display: flex; align-items: center; gap: 10px; background: transparent;}
  .wallet-disp .icon { width: 24px; height: 24px; background: url('../images/wallet-icon.png') no-repeat center/contain; }
  
  /* Main Container */
  .game-wrapper {
    display: flex;
    flex: 1;
    justify-content: flex-start;
    align-items: stretch;
    padding: 20px;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Left Controls Sidebar */
  .controls-sidebar {
    width: 300px;
    background-color: #213743;
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
    overflow-y: auto;
  }

  /* Toggles */
  .toggle-group { display: flex; background: #0f212e; border-radius: 54px; padding: 2px; }
  .toggle-btn { flex: 1; text-align: center; padding: 10px; color: #b1bad3; font-weight: 600; cursor: pointer; border-radius: 54px; transition: 0.2s; font-size: 14px; }
  .toggle-btn.active { background: #2f4553; color: white; }

  /* Input Groups */
  .input-label { font-size: 13px; margin-bottom: 5px; font-weight: 600; color: #b1bad3; display: flex; justify-content: space-between; }
  .input-box { background: #0f212e; border: 2px solid transparent; border-radius: 4px; display: flex; align-items: center; transition: 0.2s; }
  .input-box:focus-within { border-color: #2f4553; }
  .input-box input { background: transparent; border: none; color: white; padding: 12px; font-weight: 600; font-size: 14px; width: 100%; outline: none; flex: 1; }
  .input-box input::-webkit-outer-spin-button, .input-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .input-addon { padding: 0 10px; color: #b1bad3; display: flex; align-items: center; gap: 5px; font-weight: bold; }
  .action-btns { display: flex; }
  .action-btns button { background: #2f4553; color: white; border: none; padding: 0 12px; font-weight: 600; cursor: pointer; border-left: 1px solid #0f212e; transition: 0.2s; }
  .action-btns button:first-child { border-left: none; }
  .action-btns button:hover { background: #3d5566; }

  /* Buttons */
  .bet-btn { background: #256bf5; color: white; border: none; padding: 16px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
  .bet-btn.cashout { background: #1fff20; color: #000; box-shadow: 0 0 10px rgba(31, 255, 32, 0.4); }
  .bet-btn.active-bet { background: #2f4553; color: white; cursor: not-allowed; }
  .bet-btn:hover:not(.active-bet) { opacity: 0.9; }
  
  .random-btn { background: #2f4553; color: white; padding: 12px; border-radius: 4px; font-weight:600; cursor:pointer; font-size:14px; border:none; transition:0.2s; }
  .random-btn:hover:not(:disabled) { background: #3d5566; }
  .random-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Heads/Tails Selection */
  .coin-choices { display: flex; gap: 10px; }
  .choice-btn { flex:1; background: #2f4553; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .choice-btn:hover:not(:disabled) { background: #3d5566; }
  .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .icon-heads { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(135deg, #f1c40f, #e67e22); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
  .icon-tails { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(135deg, #9b59b6, #3498db); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
  .icon-tails::after { content: ''; width: 6px; height: 6px; background: rgba(0,0,0,0.3); transform: rotate(45deg); display: block; }

  /* Right Game Area */
  .game-area {
    flex: 1;
    background-color: #0b1821;
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    flex-direction: column;
  }

  /* The 3D Coin */
  .coin-container {
    perspective: 1000px;
    width: 200px;
    height: 200px;
    position: relative;
  }
  
  .coin {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
    transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  .coin-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.5);
  }
  
  /* Face: Heads (Yellow/Orange) */
  .coin-front {
    background: linear-gradient(135deg, #f1c40f 0%, #e67e22 100%);
    z-index: 2;
  }
  .coin-front .inner-shape {
    display: block;
    width: 60%;
    height: 60%;
    background: #f39c12;
    border-radius: 50%;
    box-shadow: inset 0 4px 6px rgba(0,0,0,0.2);
  }
  
  /* Face: Tails (Purple/Blue) */
  .coin-back {
    background: linear-gradient(135deg, #9b59b6 0%, #3498db 100%);
    transform: rotateY(180deg);
  }
  .coin-back .inner-shape {
    display: block;
    width: 50%;
    height: 50%;
    background: rgba(0, 0, 0, 0.15);
    transform: rotate(45deg);
    box-shadow: inset 0 4px 6px rgba(0,0,0,0.2);
  }

  /* History Bar */
  .history-bar {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: #0f212e;
    border-radius: 4px;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
  }
  .history-bar::-webkit-scrollbar { height: 4px; }
  .history-bar::-webkit-scrollbar-track { background: transparent; }
  .history-bar::-webkit-scrollbar-thumb { background: #2f4553; border-radius: 4px; }
  
  .history-label { font-size: 13px; font-weight: bold; color: #8790a6; margin-right: 10px; }
  
  .history-item {
    width: 24px; height: 24px; border-radius: 4px; background: #1a2c38;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* Status Overlay */
  .status-overlay {
    position: absolute; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    inset: 0; pointer-events: none; z-index: 20;
    background: rgba(0,0,0,0.6);
  }
  .status-banner {
    background: #1fff20; color: #000; padding: 15px 40px; border-radius: 8px; font-size: 24px; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.5); text-align: center;
    animation: popIn 0.3s forwards;
  }
  .status-banner.loss { background: #ff2a2a; color: white; }
  .status-sub { font-size: 16px; margin-top: 5px; opacity: 0.8; font-weight:bold; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

  /* Responsive styling */
  @media (max-width: 850px) {
    .game-wrapper { flex-direction: column-reverse; overflow-y: auto; }
    .controls-sidebar { width: 100%; }
    .game-area { min-height: 400px; }
    .coin-container { width: 150px; height: 150px; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="../dashboard.html" class="btn-back">← Back</a>
  <div class="wallet-disp">
    <div class="icon"></div>
    <span id="walletText">₹0.00</span>
  </div>
</div>

<div class="game-wrapper">
  <!-- Sidebar -->
  <div class="controls-sidebar">
    <div class="toggle-group"><div class="toggle-btn active" id="manualToggle">Manual</div><div class="toggle-btn" id="autoToggle">Auto</div></div>

    <!-- Bet Amount -->
    <div>
      <div class="input-label"><span>Bet Amount</span><span id="maxBetInfo" style="color:#1fff20;cursor:pointer;">₹0.00</span></div>
      <div class="input-box">
        <div class="input-addon">₹</div>
        <input type="number" id="betAmount" value="0.00" min="0" step="0.01">
        <div class="action-btns"><button id="btnHalf">½</button><button id="btnDouble">2×</button></div>
      </div>
    </div>

    <button class="bet-btn" id="betBtn">Bet</button>

    <button class="random-btn" id="randomBtn" disabled>Random Pick</button>
    
    <div class="coin-choices">
      <button class="choice-btn" id="headsBtn" disabled>Heads <div class="icon-heads"></div></button>
      <button class="choice-btn" id="tailsBtn" disabled>Tails <div class="icon-tails"></div></button>
    </div>

    <!-- Profit Indicator -->
    <div>
      <div class="input-label"><span>Total Profit (<span id="currentMultiLabel">1.00</span>×)</span></div>
      <div class="input-box" style="background:#1a2c38;">
        <div class="input-addon">₹</div>
        <input type="text" id="totalProfit" value="0.00" disabled style="color:#1fff20;">
      </div>
    </div>
  </div>

  <!-- Game Area -->
  <div class="game-area">
    <div class="coin-container">
      <div class="coin" id="coinCore">
        <div class="coin-face coin-front">
          <div class="inner-shape" style="overflow:hidden"></div>
        </div>
        <div class="coin-face coin-back">
          <div class="inner-shape"></div>
        </div>
      </div>
    </div>
    
    <div class="history-bar" id="historyBar">
      <div class="history-label">History</div>
      <!-- History items injected here -->
    </div>
    
    <div class="status-overlay" id="statusOverlay">
      <div class="status-banner" id="statusBanner">
        <div id="statusTitle">1.50x</div><div class="status-sub" id="statusSub">Multiplier</div>
      </div>
    </div>
  </div>
</div>

<script>
  // DOM Error Injector
  function panic(title, details) {
    document.body.innerHTML = `
      <div style="background:#ff2a2a; color:white; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 40px;">
        <h1 style="font-size: 50px; margin-bottom: 20px;">🚨 ${title}</h1>
        <p style="font-size: 24px;">${details}</p>
        <button onclick="window.location.reload()" style="margin-top:40px; padding:20px 40px; font-size: 20px; cursor:pointer; color:black;">Reload Game</button>
      </div>`;
    throw new Error(title + " | " + details);
  }

  const token = localStorage.getItem('access_token');
  if (!token) window.location.href = "../index.html";

  async function apiFetch(endpoint, method, body) {
    let res;
    try {
      res = await fetch(`http://127.0.0.1:8000/api/games/flip/${endpoint}/`, {
        method: method,
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
    } catch(e) {
      panic("API OFFLINE", "Node server unreachable: " + e.message);
    }
    if (res.status === 401) {
       localStorage.removeItem('access_token');
       panic("SESSION EXPIRED", "Please log in again.");
    }
    return res;
  }

  /* --- WALLET --- */
  let walletBalance = parseFloat(localStorage.getItem('walletBalance')) || 0;
  
  const walletText = document.getElementById('walletText');
  const maxBetInfo = document.getElementById('maxBetInfo');
  
  function updateWalletDisplay() {
    walletText.innerText = '₹' + walletBalance.toFixed(2);
    maxBetInfo.innerText = '₹' + walletBalance.toFixed(2);
    localStorage.setItem('walletBalance', walletBalance.toFixed(2));
  }
  updateWalletDisplay();

  /* --- UI COMPONENTS --- */
  const betAmountInput = document.getElementById('betAmount');
  const btnHalf = document.getElementById('btnHalf');
  const btnDouble = document.getElementById('btnDouble');
  const betBtn = document.getElementById('betBtn');
  const randomBtn = document.getElementById('randomBtn');
  const headsBtn = document.getElementById('headsBtn');
  const tailsBtn = document.getElementById('tailsBtn');
  const totalProfitInput = document.getElementById('totalProfit');
  const currentMultiLabel = document.getElementById('currentMultiLabel');
  
  const coinCore = document.getElementById('coinCore');
  const historyBar = document.getElementById('historyBar');
  
  const statusOverlay = document.getElementById('statusOverlay');
  const statusBanner = document.getElementById('statusBanner');
  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSub');

  /* --- Config & State --- */
  let isPlaying = false;
  let isFlipping = false;
  let activeGameId = null;
  let currentBet = 0;
  let currentMulti = 1.00;
  let flipsWon = 0;
  let coinRotations = 0; 
  
  /* --- BET INPUTS --- */
  btnHalf.onclick = () => { if(!isPlaying) { let v = parseFloat(betAmountInput.value)/2; betAmountInput.value = (v>0?v:0).toFixed(2); } };
  btnDouble.onclick = () => { if(!isPlaying) { let v = parseFloat(betAmountInput.value)*2; betAmountInput.value = (v>0?v:0).toFixed(2); } };
  maxBetInfo.onclick = () => { if(!isPlaying) { betAmountInput.value = walletBalance.toFixed(2); } }

  /* --- START GAME --- */
  betBtn.addEventListener('click', () => {
    if (isFlipping) return;
    if (!isPlaying) startGame();
    else cashout();
  });
  
  async function startGame() {
    let bet = parseFloat(betAmountInput.value);
    if (isNaN(bet) || bet < 0) bet = 0;
    
    betAmountInput.disabled = btnHalf.disabled = btnDouble.disabled = true;
    betBtn.disabled = true;
    betBtn.innerText = 'CONNECTING...';
    
    const res = await apiFetch('start', 'POST', { bet: bet });
    let data;
    try { data = await res.json(); } catch(e) { panic("SERVER CORRUPTION", "Invalid JSON payload mapping."); }
    
    if (!res.ok) {
       alert(data.detail || "Failed to start server-side game.");
       betAmountInput.disabled = btnHalf.disabled = btnDouble.disabled = false;
       betBtn.disabled = false;
       betBtn.innerText = 'Bet';
       return;
    }

    activeGameId = data.game_id;
    walletBalance = parseFloat(data.wallet_balance);
    updateWalletDisplay();
    
    randomBtn.disabled = headsBtn.disabled = tailsBtn.disabled = false;
    statusOverlay.style.display = 'none';
    
    currentBet = bet;
    currentMulti = 1.00; 
    flipsWon = 0;
    isPlaying = true;
    
    updateProfitUI();
    
    betBtn.className = 'bet-btn active-bet';
    betBtn.disabled = false;
    betBtn.innerText = 'Bet';
  }

  /* --- COIN FLIPPING --- */
  randomBtn.addEventListener('click', () => {
    if(!isPlaying || isFlipping) return;
    performFlip(Math.random() < 0.5 ? 'heads' : 'tails');
  });
  headsBtn.addEventListener('click', () => {
    if(!isPlaying || isFlipping) return;
    performFlip('heads');
  });
  tailsBtn.addEventListener('click', () => {
    if(!isPlaying || isFlipping) return;
    performFlip('tails');
  });

  async function performFlip(playerChoice) {
    if (!activeGameId) panic("GAME ID LOST", "Out of sync.");
    
    isFlipping = true;
    randomBtn.disabled = headsBtn.disabled = tailsBtn.disabled = true;
    betBtn.className = 'bet-btn active-bet'; 
    
    const res = await apiFetch('flip', 'POST', { game_id: activeGameId, choice: playerChoice });
    let data;
    try { data = await res.json(); } catch(e) { panic("FLIP CRASHED", "Node server exploded during lookup!"); }
    
    if (!res.ok) {
       panic("ERROR", data.detail || "Server rejected flip.");
       return;
    }
    
    let actualOutcome = data.outcome;
    let isWin = data.status !== 'exploded';
    
    if(isWin) currentMulti = parseFloat(data.multiplier);

    // Animate Coin 
    let spinAmount = 3600; 
    if(actualOutcome === 'heads') {
       coinRotations = Math.ceil(coinRotations / 360) * 360 + spinAmount;
    } else {
       coinRotations = Math.floor(coinRotations / 360) * 360 + spinAmount + 180;
    }
    
    coinCore.style.transform = `rotateY(${coinRotations}deg)`;
    
    setTimeout(() => {
      resolveFlip(actualOutcome, isWin);
    }, 1500); 
  }

  function resolveFlip(outcome, isWin) {
    appendHistory(outcome);
    isFlipping = false;
    
    if (isWin) {
      flipsWon++;
      updateProfitUI();
      
      let payout = currentBet * currentMulti;
      betBtn.className = 'bet-btn cashout';
      betBtn.innerText = `Cashout ₹${payout.toFixed(2)}`;
      betBtn.disabled = false;
      randomBtn.disabled = headsBtn.disabled = tailsBtn.disabled = false;
    } else {
      triggerLoss();
    }
  }

  function triggerLoss() {
    isPlaying = false;
    betBtn.className = 'bet-btn';
    betBtn.innerText = 'Bet';
    totalProfitInput.value = "0.00";
    currentMultiLabel.innerText = "0.00";
    
    betAmountInput.disabled = btnHalf.disabled = btnDouble.disabled = false;
    randomBtn.disabled = headsBtn.disabled = tailsBtn.disabled = true;
    showBanner("0.00x", "Multiplier", true);
  }

  async function cashout() {
    if (!isPlaying || flipsWon === 0) return;
    
    betBtn.disabled = true;
    betBtn.innerText = 'CASHING OUT...';
    
    const res = await apiFetch('cashout', 'POST', { game_id: activeGameId });
    let data;
    try { data = await res.json(); } catch(e) { panic("CASHOUT CRASHED", "Node server failed cashout transaction!"); }

    if (!res.ok) {
        panic("CASHOUT ERROR", data.detail || "Server rejected cashout.");
        return;
    }

    walletBalance = parseFloat(data.wallet_balance);
    updateWalletDisplay();
    
    isPlaying = false;
    betBtn.className = 'bet-btn';
    betBtn.innerText = 'Bet';
    betBtn.disabled = false;
    
    betAmountInput.disabled = btnHalf.disabled = btnDouble.disabled = false;
    randomBtn.disabled = headsBtn.disabled = tailsBtn.disabled = true;
    
    showBanner(`${currentMulti.toFixed(2)}x`, `Payout ₹${data.payout.toFixed(2)}`, false);
  }

  function appendHistory(outcome) {
    let el = document.createElement('div');
    el.className = 'history-item';
    if(outcome === 'heads') {
      el.innerHTML = '<div class="icon-heads"></div>';
    } else {
      el.innerHTML = '<div class="icon-tails"></div>';
    }
    historyBar.appendChild(el);
    historyBar.scrollLeft = historyBar.scrollWidth;
  }
  
  function updateProfitUI() {
    let payout = currentBet * currentMulti;
    if(flipsWon === 0 && isPlaying) payout = 0; 
    totalProfitInput.value = payout.toFixed(2);
    currentMultiLabel.innerText = currentMulti.toFixed(2);
  }
  
  function showBanner(title, sub, isLoss) {
    statusBanner.className = isLoss ? 'status-banner loss' : 'status-banner';
    statusTitle.innerText = title;
    statusSub.innerText = sub;
    statusOverlay.style.display = 'flex';
  }

</script>
</body>
</html>
